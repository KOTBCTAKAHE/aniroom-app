name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report compiler errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          lines = [l.rstrip() for l in open("build.log", errors="replace") if re.match(r"^(e: |w: .*deprecated)", l) or "What went wrong" in l]
          errs = [l.replace("file:///home/runner/work/aniroom-app/aniroom-app/app/src/main/java/space/aniroom/app/", "") for l in lines if l.startswith("e: ")] or lines[:20]
          chunk = []
          for i in range(0, len(errs), 15):
              msg = "%0A".join(e.replace("%", "%25") for e in errs[i:i+15])
              print(f"::error::{msg}")
          PY

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/AniRoom-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AniRoom-${{ github.run_number }}
          path: out/*.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AniRoom ${{ github.run_number }}
          make_latest: true
          files: out/*.apk
          body: |
            ${{ github.event.head_commit.message }}

            Сборка №${{ github.run_number }}. Приложение само предложит обновиться.
